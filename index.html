  <style>
    #dsc-splash {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at center, rgba(34, 197, 94, 0.08), transparent 38%),
        #ffffff;
      opacity: 1;
      visibility: visible;
      transition:
        opacity 1100ms cubic-bezier(0.22, 1, 0.36, 1),
        visibility 1100ms;
    }

    #dsc-splash.dsc-splash-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .dsc-splash-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: translateY(0);
    }

    .dsc-splash-logo-wrap {
      position: relative;
      width: 170px;
      height: 170px;
      display: grid;
      place-items: center;
      animation: dscSplashLogoIn 1800ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .dsc-splash-logo {
      position: relative;
      z-index: 3;
      width: 132px;
      height: 132px;
      object-fit: contain;
      filter: drop-shadow(0 12px 34px rgba(15, 23, 42, 0.12));
    }

    .dsc-splash-logo-wrap::after {
      content: "";
      position: absolute;
      z-index: 4;
      top: -18%;
      left: -55%;
      width: 32%;
      height: 136%;
      pointer-events: none;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(34, 197, 94, 0.025),
        rgba(74, 222, 128, 0.11),
        rgba(34, 197, 94, 0.025),
        transparent
      );
      filter: blur(11px);
      transform: skewX(-18deg);
      opacity: 0;
      animation: dscSplashLightSweep 1800ms 1000ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .dsc-splash-ring {
      position: absolute;
      inset: 15px;
      border: 1px solid rgba(22, 163, 74, 0.14);
      border-radius: 50%;
      animation: dscSplashRing 4.2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }

    .dsc-splash-ring-two {
      inset: 0;
      border-color: rgba(22, 163, 74, 0.07);
      animation-delay: 900ms;
    }

    .dsc-splash-title {
      margin-top: 26px;
      padding: 0 24px;
      color: #0f172a;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.045em;
      text-align: center;
      opacity: 0;
      animation: dscSplashTextIn 1200ms 950ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .dsc-splash-subtitle {
      margin-top: 7px;
      color: #16a34a;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      opacity: 0;
      animation: dscSplashTextIn 1200ms 1250ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .dsc-splash-loader {
      width: 110px;
      height: 2px;
      margin-top: 28px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.08);
      opacity: 0;
      animation: dscSplashTextIn 900ms 1550ms ease-out forwards;
    }

    .dsc-splash-loader span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: inherit;
      background: #16a34a;
      animation: dscSplashLoader 1800ms ease-in-out infinite;
    }

    @keyframes dscSplashLogoIn {
      0% {
        opacity: 0;
        transform: scale(0.72);
      }

      65% {
        opacity: 1;
        transform: scale(1.06);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes dscSplashRing {
      0% {
        opacity: 0;
        transform: scale(0.72);
      }

      25% {
        opacity: 1;
      }

      100% {
        opacity: 0;
        transform: scale(1.35);
      }
    }

    @keyframes dscSplashLightSweep {
      0% {
        left: -55%;
        opacity: 0;
      }

      15% {
        opacity: 0.35;
      }

      55% {
        opacity: 0.28;
      }

      100% {
        left: 125%;
        opacity: 0;
      }
    }

    @keyframes dscSplashTextIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes dscSplashLoader {
      0% {
        transform: translateX(-140%);
      }

      50% {
        transform: translateX(160%);
      }

      100% {
        transform: translateX(260%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #dsc-splash,
      .dsc-splash-logo-wrap,
      .dsc-splash-ring,
      .dsc-splash-title,
      .dsc-splash-subtitle,
      .dsc-splash-loader,
      .dsc-splash-logo-wrap::after {
        animation: none !important;
      }

      .dsc-splash-title,
      .dsc-splash-subtitle,
      .dsc-splash-loader {
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <div id="dsc-splash" aria-label="DSC Society" role="status">
    <div class="dsc-splash-inner">
      <div class="dsc-splash-logo-wrap">
        <span class="dsc-splash-ring dsc-splash-ring-one"></span>
        <span class="dsc-splash-ring dsc-splash-ring-two"></span>
        <img
          src="/dsc-logo.png"
          alt="DSC Society"
          class="dsc-splash-logo"
        />
      </div>

      <div class="dsc-splash-title">
        Dharitree Samrakshana Chaitanyam
      </div>

      <div class="dsc-splash-subtitle">
        DSC Society
      </div>

    </div>
  </div>

  <div id="root"></div>

  <script>
    (() => {
      const splash = document.getElementById("dsc-splash");

      if (!splash) return;

      const hideSplash = () => {
        window.setTimeout(() => {
          splash.classList.add("dsc-splash-hidden");

          window.setTimeout(() => {
            splash.remove();
          }, 1100);
        }, 3500);
      };

      if (document.readyState === "complete") {
        hideSplash();
      } else {
        window.addEventListener("load", hideSplash, { once: true });
      }
    })();
  </script>

  <script type="module" src="/src/main.tsx"></script>

</body>
